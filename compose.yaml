services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN:?Please configure DOMAIN in .env}
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  caddy_data:
  caddy_config:
